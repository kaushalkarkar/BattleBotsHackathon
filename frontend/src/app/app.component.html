<header>
  <button class="theme-toggle" (click)="toggleTheme()"
          [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          [title]="theme === 'dark' ? 'Light mode' : 'Dark mode'">
    {{ theme === 'dark' ? '☀️' : '🌙' }}
  </button>
  <h1>⚔️ BattleBots <span>Win Predictor</span></h1>
  <p>Predict matchups, simulate tournaments, and validate the model — all from web data collected with Bright Data.</p>
  <div class="tag">#BattleBotsDev</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav>
      <button [class.active]="view === 'predict'" (click)="setView('predict')">
        <span class="ico">🥊</span><span class="lbl">Predictor</span>
      </button>
      <button [class.active]="view === 'tournament'" (click)="setView('tournament')">
        <span class="ico">🏟️</span><span class="lbl">Tournament</span>
      </button>
      <button [class.active]="view === 'backtest'" (click)="setView('backtest')">
        <span class="ico">🔬</span><span class="lbl">Model accuracy</span>
      </button>
      <button [class.active]="view === 'insights'" (click)="setView('insights')">
        <span class="ico">📈</span><span class="lbl">Insights</span>
      </button>
      <button [class.active]="view === 'arena'" (click)="setView('arena')">
        <span class="ico">⚔️</span><span class="lbl">Arena</span>
      </button>
    </nav>
  </aside>

  <main>
    <ng-container *ngIf="view === 'predict'">
      <app-predictor
        [robots]="robots"
        [prediction]="prediction"
        [loading]="loading"
        [error]="error"
        (predict)="onPredict($event)">
      </app-predictor>

      <app-leaderboard [rows]="leaderboard" (openRobot)="openRobot($event)"></app-leaderboard>
    </ng-container>

    <app-tournament
      *ngIf="view === 'tournament'"
      [robots]="robots"
      [defaultSeeds]="topSeeds"
      [result]="tournament"
      [loading]="tournamentLoading"
      (run)="onRunTournament($event)">
    </app-tournament>

    <app-backtest *ngIf="view === 'backtest'" [result]="backtest"></app-backtest>

    <app-insights
      *ngIf="view === 'insights'"
      [meta]="weaponMeta"
      [upsets]="upsets">
    </app-insights>

    <app-arena *ngIf="view === 'arena'" [robots]="robots"></app-arena>
  </main>
</div>

<app-robot-detail
  *ngIf="detailOpen"
  [detail]="detail"
  [loading]="detailLoading"
  (close)="closeDetail()"
  (openRobot)="openRobot($event)">
</app-robot-detail>

<footer>
  Built with Bright Data BattleBots web data · Angular + FastAPI · #BattleBotsDev
</footer>
